# kairos-triage-agent runtime configuration.
#
# This file describes WHERE the agent looks and HOW OFTEN.
# Takeover decision logic lives in rules.yaml.

agent:
  # GitHub login used by the agent when assigning itself, opening PRs, and
  # commenting. Must match the token's owner.
  github_user: itxaka-agent

  # Fork namespace. All pull requests are opened from
  # <fork_owner>/<repo>:<branch> against the upstream repo.
  fork_owner: itxaka-agent

  # Local scratch directory (relative to the project root) where the agent
  # clones repositories. Gitignored.
  workspace: workspace

  # Poll cadence. Every interval the agent walks the repository list below.
  poll_interval: 30m

  # Hard cap on how many tickets the agent will take on in a single cycle.
  # Prevents a flood of new issues from overwhelming its investigation queue.
  max_new_tickets_per_cycle: 2

  # Fixed processing order per cycle. Higher priority workloads drain first;
  # the agent only descends the list when the current stage has nothing to
  # do. See RULES.md rule 8.
  pipeline:
    - review_prs
    - triage_issues

  # Label the agent applies to any ticket it is actively working on. Rule 12.
  ongoing_label: in-progress

# Release-meta prioritization. See RULES.md rule 16.
release_meta:
  # Repositories whose issues are scanned for meta tickets. Typically just
  # the top-level `kairos` repo, which is where the release roadmap lives.
  repos:
    - kairos-io/kairos

  # A ticket is treated as a release meta when it carries this label OR
  # its title matches the regex below. Both signals are OR-ed.
  detection:
    label: release
    title_regex: '^Release v?\d+\.\d+\.\d+'

  # Version → tag mapping. To decide whether a meta ticket's version is
  # already shipped, the agent looks for a matching git tag under this
  # tag_prefix on the meta's home repo.
  tag_prefix: v

  # Reference extraction patterns. Applied to the meta ticket body and
  # every comment. Anything matched here joins the priority queue.
  reference_patterns:
    - '#(?P<num>\d+)'                                   # bare #123
    - 'kairos-io/(?P<repo>[a-z0-9\-]+)#(?P<num>\d+)'    # cross-repo
    - 'https://github\.com/kairos-io/(?P<repo>[a-z0-9\-]+)/(issues|pull)/(?P<num>\d+)'

# Working hours and time slots. See RULES.md rule 11.
schedule:
  # Local timezone the working window is expressed in.
  timezone: Europe/Madrid

  # Working window (inclusive start, exclusive end). Outside this window the
  # agent does not start new work.
  working_hours:
    start: "08:00"
    end:   "17:00"

  # Each ticket occupies at least one slot of this length. The next-pickup
  # decision runs at slot boundaries, not on task completion.
  slot_minutes: 30

  # Days of the week the agent runs on (0 = Sunday … 6 = Saturday).
  active_weekdays: [1, 2, 3, 4, 5]

# Multi-role fleet. See docs/agent-roles.md and RULES.md rules 17-19, 22.
roles:
  # Each role runs in its own subprocess (rule 22). This gives clean crash
  # boundaries, fresh LLM context per role, and structural reviewer
  # independence from the coder.
  isolation: subprocess

  # Hard cap on reviewer/worker rounds before the manager escalates.
  max_review_rounds: 3

  # Where per-ticket envelopes live. Crash-recoverable state; also the
  # audit trail a human reads to see what the roles said to each other.
  state_dir: workspace/.state

  # How many tickets the manager keeps in flight at once. Kept at 1 while
  # the fleet stabilizes; slot alignment (rule 11) is simpler with a
  # single-ticket queue. Raise later once the runtime is proven.
  concurrency: 1

  # Model choice per role is defined in the agent frontmatter of each
  # `.claude/agents/kairos-triage-<role>.md` file, since that is what
  # Claude Code actually reads when spawning the subagent. See
  # docs/claude-code-integration.md.

# Global cost budget with a rolling window. See RULES.md rule 21. Per-ticket
# caps are the wrong tool here — some tickets legitimately cost more than
# others — so the budget aggregates across every role and every ticket.
budget:
  # Window over which spend is aggregated. Anything older than this rolls off.
  window: 24h

  # Soft threshold — a warning is logged the first time it is crossed in a
  # window. Work continues. Useful for spotting a runaway before the hard
  # cap trips.
  usd_soft_cap: 15.00

  # Hard threshold — the manager finishes in-flight work, publishes its
  # audit trail, then stops picking up new tickets until the rolling total
  # falls back below this line as the window advances.
  usd_cap: 20.00

  # Persistent rolling-window ledger. Survives restarts.
  ledger_path: workspace/.state/budget.json

# Audit trail publication. See RULES.md rule 20.
audit:
  # Where the summary lives. Currently: a comment on the issue, with the PR
  # description linking to it. Kept as an enum so a future gist-only or
  # PR-body variant is a config change, not a code change.
  target: issue_comment

  # Attach the raw envelope inline (fenced in a collapsed <details> block)
  # when it fits under this many characters. Larger envelopes go to a gist
  # under the itxaka-agent account and are linked from the summary.
  inline_envelope_max_chars: 40000

  # Redaction applied to both the summary and the raw envelope before
  # anything leaves the workspace. Rule 20.
  redact:
    home_paths:    true       # $HOME -> ~
    mac_addresses: true       # xx:xx:xx:xx:xx:xx
    public_ips:    true       # non-loopback / non-RFC1918 / non-documentation
    token_shapes:
      - '(?i)ghp_[A-Za-z0-9]{20,}'
      - '(?i)github_pat_[A-Za-z0-9_]{20,}'
      - '(?i)aws(.{0,20})?(secret|access).{0,5}=?\s*[A-Za-z0-9/+=]{20,}'
      - '-----BEGIN [A-Z ]*PRIVATE KEY-----'

# Repositories the agent watches. Order is significant: earlier entries are
# scanned first each cycle, so put the highest-signal repos on top.
repositories:
  - owner: kairos-io
    name: kairos
    default_branch: master
    watch:
      issues: true
      pull_requests: true
  - owner: kairos-io
    name: auroraboot
    default_branch: main
    watch:
      # Issue triage stays scoped to the kairos repo per user direction.
      issues: false
      pull_requests: true

# GitHub authentication.
#
# The agent expects a Personal Access Token (fine-grained, scoped to the
# fork namespace and to `issues: write` / `pull_requests: write` on the
# upstream repos it needs to comment on) exposed via the environment
# variable named here. The file itself never contains the token.
github:
  token_env: KAIROS_TRIAGE_GITHUB_TOKEN

# Reproduction toolchain. When rules.yaml marks an issue as
# `reproduce_in_qemu: true`, these settings drive the VM.
qemu:
  # Path to the ISO builder helper the agent should use. `auroraboot` is the
  # canonical Kairos ISO builder.
  iso_builder: auroraboot
  # Where built ISOs and disk images are cached between cycles.
  artifact_cache: workspace/.artifacts
  # Default resources for the reproduction VM.
  vm:
    memory_mb: 4096
    cpus: 2
    kvm: true

logging:
  level: info
  # Per-cycle log file; rotated by cycle timestamp.
  dir: workspace/.logs
